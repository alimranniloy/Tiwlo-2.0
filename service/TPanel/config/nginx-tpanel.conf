# ========================================================
# TPanel (Tiwlo Control Panel) Nginx Virtual Host Configuration
# Subdomain: tpanel.tiwlo.com
# Reverse Proxy: 127.0.0.1:5000
# ========================================================

server {
    listen 80;
    listen [::]:80;
    server_name tpanel.tiwlo.com;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tpanel.tiwlo.com;

    # SSL Certificate Configuration (Managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/tiwlo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiwlo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Client body size for file uploads in File Manager
    client_max_body_size 500M;

    # Root directory for static SPA client build
    root /var/www/tiwlo/client/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/x-javascript application/json image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API Proxy to Node.js Backend Engine
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-TPanel-Origin "tpanel.tiwlo.com";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA Fallback: Direct all frontend routes to index.html with TPanel header
    location / {
        try_files $uri $uri/ /index.html;
    }
}
