version: '3.8'

services:
  # ===================================================================
  # 1. PostgreSQL 16 Enterprise Database Engine (Multi-Tenant)
  # ===================================================================
  postgres:
    image: postgres:16-alpine
    container_name: tiwlo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tiwlo_master}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - tiwlo_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tiwlo_master"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tiwlo-network

  # ===================================================================
  # 2. pgAdmin 4 Web GUI for Database Management
  # ===================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tiwlo-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${VITE_ADMIN_EMAIL_LOCAL_PART:-admin}@${VITE_PRIMARY_DOMAIN:-tiwlo.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tiwlo-network

  # ===================================================================
  # 3. Tiwlo StockPro Application (Backend + Frontend)
  # ===================================================================
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tiwlo-app
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5000:5000"
      - "5001:5001"
      - "5173:5173"
    environment:
      NODE_ENV: production
      SSL_PROVIDER: unsupported
      PORT: 5000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tiwlo_master
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: tiwlo_master
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tiwlo-network

volumes:
  tiwlo_pgdata:
    driver: local

networks:
  tiwlo-network:
    driver: bridge
