services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tiwlo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tiwlo_master}
    volumes:
      - tiwlo_pgdata_v2:/var/lib/postgresql/data
    # Host Postfix needs a private connection for its PostgreSQL mailbox map.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [tiwlo]

  dns:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VITE_PRIMARY_DOMAIN: ${VITE_PRIMARY_DOMAIN:-tiwlo.com}
        VITE_STORE_DOMAIN: ${VITE_STORE_DOMAIN:-}
        VITE_FREE_SUBDOMAIN_DOMAIN: ${VITE_FREE_SUBDOMAIN_DOMAIN:-uids.app}
        VITE_MANAGED_DOMAINS: ${VITE_MANAGED_DOMAINS:-}
        VITE_SERVER_IPV4: ${VITE_SERVER_IPV4:-}
        VITE_SERVER_IPV6: ${VITE_SERVER_IPV6:-}
        VITE_AUTH_DOMAIN: ${VITE_AUTH_DOMAIN:-auth.tiwlo.com}
        VITE_DASHBOARD_URL: ${VITE_DASHBOARD_URL:-https://uids.app}
        VITE_WWW_SUBDOMAIN: ${VITE_WWW_SUBDOMAIN:-www}
        VITE_AUTH_SUBDOMAIN: ${VITE_AUTH_SUBDOMAIN:-auth}
        VITE_TPANEL_SUBDOMAIN: ${VITE_TPANEL_SUBDOMAIN:-tpanel}
        VITE_DNS1_SUBDOMAIN: ${VITE_DNS1_SUBDOMAIN:-dns1}
        VITE_DNS2_SUBDOMAIN: ${VITE_DNS2_SUBDOMAIN:-dns2}
        VITE_MAIL_SUBDOMAIN: ${VITE_MAIL_SUBDOMAIN:-tmail}
        VITE_MTA_SUBDOMAIN: ${VITE_MTA_SUBDOMAIN:-mail}
        VITE_DRIVE_SUBDOMAIN: ${VITE_DRIVE_SUBDOMAIN:-drive}
    command: ["node", "server/dns/dnsServer.js"]
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      DNS_HOST: 0.0.0.0
      DNS_PORT: 53
      VITE_PRIMARY_DOMAIN: ${VITE_PRIMARY_DOMAIN:-tiwlo.com}
      VITE_FREE_SUBDOMAIN_DOMAIN: ${VITE_FREE_SUBDOMAIN_DOMAIN:-uids.app}
      VITE_MANAGED_DOMAINS: ${VITE_MANAGED_DOMAINS:-}
      VITE_DNS1_SUBDOMAIN: ${VITE_DNS1_SUBDOMAIN:-dns1}
      VITE_DNS2_SUBDOMAIN: ${VITE_DNS2_SUBDOMAIN:-dns2}
      VITE_AUTH_DOMAIN: ${VITE_AUTH_DOMAIN:-auth.tiwlo.com}
      VITE_DASHBOARD_URL: ${VITE_DASHBOARD_URL:-https://uids.app}
      VITE_MAIL_SUBDOMAIN: ${VITE_MAIL_SUBDOMAIN:-tmail}
      VITE_MTA_SUBDOMAIN: ${VITE_MTA_SUBDOMAIN:-mail}
      VITE_DNS_TTL: ${VITE_DNS_TTL:-300}
      VITE_DNS_NS_TTL: ${VITE_DNS_NS_TTL:-86400}
      VITE_DNS_SOA_TTL: ${VITE_DNS_SOA_TTL:-3600}
      VITE_DNS_DMARC_POLICY: ${VITE_DNS_DMARC_POLICY:-quarantine}
      VITE_DNS_SPF_POLICY: ${VITE_DNS_SPF_POLICY:-~all}
      VITE_DKIM_SELECTOR: ${VITE_DKIM_SELECTOR:-tiwlo}
      VITE_SERVER_IPV4: ${VITE_SERVER_IPV4:-}
      VITE_SERVER_IPV6: ${VITE_SERVER_IPV6:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-tiwlo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tiwlo_master}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-tiwlo}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-tiwlo_master}
    ports:
      - target: 53
        published: "53"
        protocol: tcp
        host_ip: "${VITE_SERVER_IPV4:-127.0.0.1}"
      - target: 53
        published: "53"
        protocol: udp
        host_ip: "${VITE_SERVER_IPV4:-127.0.0.1}"
      - target: 53
        published: "53"
        protocol: tcp
        host_ip: "${VITE_SERVER_IPV6:-::1}"
      - target: 53
        published: "53"
        protocol: udp
        host_ip: "${VITE_SERVER_IPV6:-::1}"
    volumes:
      - tiwlo_app_data:/app/server/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const { UDPClient } = require('./server/node_modules/dns2'); UDPClient({ dns: '127.0.0.1', timeout: 2000 })(process.env.VITE_PRIMARY_DOMAIN, 'SOA', undefined, { recursive: false }).then(r => { process.exitCode = r.header.rcode === 0 && r.answers.length ? 0 : 1; }).catch(() => process.exit(1));"
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tiwlo]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - tiwlo_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [tiwlo]

  rust:
    build:
      context: ..
      dockerfile: server/rust-backend/Dockerfile
    restart: unless-stopped
    environment:
      TIWLO_RUST_BIND: 0.0.0.0:7100
      TIWLO_NODE_BACKEND_URL: http://app:5000
      TIWLO_INTERNAL_IDENTITY_SECRET: ${TIWLO_INTERNAL_IDENTITY_SECRET}
      SECURITY_SECRET: ${SECURITY_SECRET}
      TIWI_APP_TRUST_KEY: ${TIWI_APP_TRUST_KEY:-}
      VITE_FREE_SUBDOMAIN_DOMAIN: ${VITE_FREE_SUBDOMAIN_DOMAIN:-uids.app}
      VITE_PRIMARY_DOMAIN: ${VITE_PRIMARY_DOMAIN:-tiwlo.com}
      DATABASE_URL: postgres://${POSTGRES_USER:-tiwlo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tiwlo_master}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TIWLO_RUST_RATE_LIMIT: ${TIWLO_RUST_RATE_LIMIT:-10000}
      TIWLO_RUST_MAX_BODY_BYTES: ${TIWLO_RUST_MAX_BODY_BYTES:-1048576}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7100/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [tiwlo]

  biometrics:
    build:
      context: ..
      dockerfile: docker/biometrics.Dockerfile
    restart: unless-stopped
    environment:
      OPENBIOMETRICS_MODEL_DIR: /opt/openbiometrics/engine/models
      OPENBIOMETRICS_SHARED_TOKEN: ${OPENBIOMETRICS_SHARED_TOKEN:?OPENBIOMETRICS_SHARED_TOKEN is required}
    volumes:
      - tiwlo_biometrics_models:/opt/openbiometrics/engine/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5m
    networks: [tiwlo]

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VITE_PRIMARY_DOMAIN: ${VITE_PRIMARY_DOMAIN:-tiwlo.com}
        VITE_STORE_DOMAIN: ${VITE_STORE_DOMAIN:-}
        VITE_FREE_SUBDOMAIN_DOMAIN: ${VITE_FREE_SUBDOMAIN_DOMAIN:-uids.app}
        VITE_MANAGED_DOMAINS: ${VITE_MANAGED_DOMAINS:-}
        VITE_SERVER_IPV4: ${VITE_SERVER_IPV4:-}
        VITE_SERVER_IPV6: ${VITE_SERVER_IPV6:-}
        VITE_AUTH_DOMAIN: ${VITE_AUTH_DOMAIN:-auth.tiwlo.com}
        VITE_DASHBOARD_URL: ${VITE_DASHBOARD_URL:-https://uids.app}
        VITE_WWW_SUBDOMAIN: ${VITE_WWW_SUBDOMAIN:-www}
        VITE_AUTH_SUBDOMAIN: ${VITE_AUTH_SUBDOMAIN:-auth}
        VITE_TPANEL_SUBDOMAIN: ${VITE_TPANEL_SUBDOMAIN:-tpanel}
        VITE_DNS1_SUBDOMAIN: ${VITE_DNS1_SUBDOMAIN:-dns1}
        VITE_DNS2_SUBDOMAIN: ${VITE_DNS2_SUBDOMAIN:-dns2}
        VITE_MAIL_SUBDOMAIN: ${VITE_MAIL_SUBDOMAIN:-tmail}
        VITE_MTA_SUBDOMAIN: ${VITE_MTA_SUBDOMAIN:-mail}
        VITE_DRIVE_SUBDOMAIN: ${VITE_DRIVE_SUBDOMAIN:-drive}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 5000
      TIWLO_INBOUND_TOKEN: ${TIWLO_INBOUND_TOKEN:?TIWLO_INBOUND_TOKEN is required}
      TIWLO_INBOUND_TRUSTED_IP: 172.30.240.1
      SMTP_PROVIDER: local_postfix
      SMTP_HOST: host.docker.internal
      SMTP_PORT: 25
      SMTP_SECURE: "false"
      SMTP_TLS_SERVERNAME: mail.${VITE_PRIMARY_DOMAIN:-tiwlo.com}
      SSL_PROVIDER: caddy
      TIWLO_RUST_BACKEND_URL: http://rust:7100
      TIWLO_INTERNAL_IDENTITY_SECRET: ${TIWLO_INTERNAL_IDENTITY_SECRET}
      # Node is not published; only the private Docker network reaches it.
      TRUSTED_PROXY_CIDRS: loopback,uniquelocal
      DATABASE_URL: postgres://${POSTGRES_USER:-tiwlo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tiwlo_master}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-tiwlo}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-tiwlo_master}
      VITE_SERVER_IPV4: ${VITE_SERVER_IPV4:-}
      VITE_SERVER_IPV6: ${VITE_SERVER_IPV6:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OPENBIOMETRICS_API_URL: http://biometrics:8000
      OPENBIOMETRICS_SHARED_TOKEN: ${OPENBIOMETRICS_SHARED_TOKEN:?OPENBIOMETRICS_SHARED_TOKEN is required}
    volumes:
      - tiwlo_uploads:/app/upload
      - tiwlo_app_data:/app/server/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host Postfix delivers inbound mail through this loopback-only endpoint.
      - "127.0.0.1:5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rust:
        condition: service_healthy
      biometrics:
        condition: service_started
    networks: [tiwlo]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${VITE_SSL_EMAIL_LOCAL_PART:-support}@${VITE_PRIMARY_DOMAIN:-tiwlo.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/www/certbot:/var/www/certbot:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [tiwlo]

volumes:
  tiwlo_pgdata_v2:
  tiwlo_redisdata:
  tiwlo_uploads:
  caddy_data:
  caddy_config:
  tiwlo_app_data:
  tiwlo_biometrics_models:

networks:
  tiwlo:
    ipam:
      config:
        - subnet: 172.30.240.0/24
    driver: bridge
