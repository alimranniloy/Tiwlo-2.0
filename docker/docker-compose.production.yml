services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tiwlo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tiwlo_master}
    volumes:
      - tiwlo_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [tiwlo]

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgres://${POSTGRES_USER:-tiwlo}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tiwlo_master}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-tiwlo}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-tiwlo_master}
    volumes:
      - tiwlo_uploads:/app/upload
    depends_on:
      postgres:
        condition: service_healthy
    networks: [tiwlo]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${VITE_SSL_EMAIL_LOCAL_PART:-support}@${VITE_PRIMARY_DOMAIN:-tiwlo.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [tiwlo]

volumes:
  tiwlo_pgdata:
  tiwlo_uploads:
  caddy_data:
  caddy_config:

networks:
  tiwlo:
    driver: bridge
