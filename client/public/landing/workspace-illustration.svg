<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" fill="none">
  <title>A little more space for your business</title>
  <desc>A hand-drawn-style workspace illustration connecting a shop, a product card, a checkout, and cloud services.</desc>
  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#222" flood-opacity=".045"/></filter>
    <pattern id="dots" x="0" y="0" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".85" fill="#d8dad6"/></pattern>
  </defs>
  <rect x="24" y="32" width="632" height="476" rx="36" fill="#f6f7f4"/>
  <rect x="44" y="52" width="592" height="436" rx="28" fill="url(#dots)"/>
  <circle cx="332" cy="264" r="182" stroke="#dfe3dc" stroke-dasharray="4 7"/>
  <path d="M136 171C101 209 103 275 128 306M495 127C539 151 565 185 570 231M465 429C425 454 379 461 339 450" stroke="#bec7bb" stroke-width="1.3" stroke-linecap="round"/>
  <path d="m120 300 9 8 1-12m433-72 8 9 6-11m-234 219-7 10 13 2" stroke="#bec7bb" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
