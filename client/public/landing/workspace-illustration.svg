    <path d="m531 119 6 3-3 7-6-3 3-7Z" fill="#f4f7f1"/>
    <text x="477" y="175" font-family="Arial,sans-serif" font-size="10" fill="#434b3e">Something worth sharing.</text>
    <text x="477" y="189" font-family="Arial,sans-serif" font-size="8" fill="#92998d">Your next collection</text>
  </g>
  <!-- Small shop and completion card. -->
  <g transform="rotate(-7 111 370)" filter="url(#shadow)">
    <rect x="53" y="314" width="113" height="111" rx="15" fill="#fff" stroke="#dedfd9"/>
    <rect x="78" y="351" width="62" height="48" rx="3" fill="#f7f5f0" stroke="#8d8980" stroke-width="1.3"/>
    <path d="m79 335-7 20h74l-7-20H79Z" fill="#e4dfd1" stroke="#8d8980" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="m93 335-3 20m17-20v20m15-20 3 20" stroke="#8d8980" stroke-width="1.3"/>
    <path d="M72 355v5c0 7 18 7 18 0 0 7 17 7 17 0 0 7 18 7 18 0 0 7 21 7 21 0v-5" fill="#f4f0e6" stroke="#8d8980" stroke-width="1.3"/>
    <rect x="88" y="375" width="16" height="14" rx="2" fill="#e0e8db" stroke="#8d8980"/>
    <path d="M114 399v-25h17v25" stroke="#8d8980" stroke-width="1.3"/><path d="M119 384v5" stroke="#8d8980" stroke-linecap="round"/>
  </g>
  <g transform="rotate(3 477 427)" filter="url(#shadow)">
    <rect x="382" y="401" width="215" height="59" rx="14" fill="white" stroke="#dedfd9"/>
    <circle cx="411" cy="430" r="14" fill="#eaf3e5"/><path d="m405 430 4 4 8-9" stroke="#6f9064" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="435" y="426" font-family="Arial,sans-serif" font-size="10" fill="#41493c">A little less to think about.</text>
    <text x="435" y="442" font-family="Arial,sans-serif" font-size="8" fill="#8c9584">A little more room to grow.</text>
  </g>
  <path d="M95 95v16m-8-8h16M607 300v12m-6-6h12" stroke="#acbba2" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="395" cy="69" r="4" stroke="#c2cbbb"/><circle cx="248" cy="469" r="3" fill="#c2cbbb"/>
  <text x="340" y="494" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" letter-spacing="1.6" fill="#9ba393">A WORKSPACE ILLUSTRATION. MADE FOR YOUR POSSIBILITIES.</text>
</svg>
