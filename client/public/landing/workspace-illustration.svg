  <g transform="rotate(-3 326 271)" filter="url(#shadow)">
    <rect x="117" y="124" width="432" height="298" rx="15" fill="white" stroke="#dcded9"/>
    <path d="M117 166H549" stroke="#eceee9"/>
    <circle cx="137" cy="145" r="3" fill="#d4d6d1"/><circle cx="149" cy="145" r="3" fill="#d4d6d1"/><circle cx="161" cy="145" r="3" fill="#d4d6d1"/>
    <rect x="218" y="135" width="170" height="19" rx="6" fill="#f6f7f4"/>
    <text x="303" y="148" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#73786f">Your Tiwlo workspace</text>
    <path d="M182 167V422" stroke="#eceee9"/>
    <rect x="138" y="189" width="20" height="20" rx="6" fill="#252925"/>
    <path d="M144 195h9m-4-1v11" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <rect x="130" y="232" width="40" height="31" rx="8" fill="#f0f2ed"/>
    <g stroke="#80887a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="143" y="241" width="5" height="5" rx="1"/><rect x="151" y="241" width="5" height="5" rx="1"/><rect x="143" y="249" width="5" height="5" rx="1"/><rect x="151" y="249" width="5" height="5" rx="1"/>
      <path d="M142 285h15v12h-15zm3 0v-3h9v3m-11 34v11h15m-11-3v-7m4 7v-12m4 12v-9"/>
      <circle cx="149" cy="366" r="7"/><path d="m147 366 2 2 3-4"/>
    </g>
    <text x="202" y="196" font-family="Arial,sans-serif" font-size="9" fill="#83897e">A LITTLE ROOM FOR EVERYTHING</text>
    <text x="202" y="222" font-family="Arial,sans-serif" font-size="20" letter-spacing="-.6" fill="#2c322b">Good things start here.</text>
    <rect x="202" y="240" width="99" height="68" rx="9" fill="#f4f6f0"/>
    <rect x="311" y="240" width="99" height="68" rx="9" fill="#f6f5f2"/>
    <rect x="420" y="240" width="108" height="68" rx="9" fill="#f1f4f7"/>
    <g stroke="#62735c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M218 255h13l2 5h-17zm0 6v9h13v-9m-9 9v-6h5v6"/></g>
    <text x="216" y="293" font-family="Arial,sans-serif" font-size="10" fill="#424b3c">Your store</text>
    <g stroke="#86745c" stroke-width="1.5" stroke-linecap="round"><rect x="325" y="254" width="19" height="13" rx="2"/><path d="M334 267v4m-5 0h10"/></g>
    <text x="325" y="293" font-family="Arial,sans-serif" font-size="10" fill="#5d5141">Point of sale</text>
    <path d="M437 270h12a5 5 0 0 0 0-10 7 7 0 0 0-13-1 5.5 5.5 0 0 0 1 11Z" stroke="#6e8399" stroke-width="1.4"/>
    <text x="434" y="293" font-family="Arial,sans-serif" font-size="10" fill="#4b5e72">Cloud tools</text>
    <text x="204" y="335" font-family="Arial,sans-serif" font-size="10" fill="#596151">Everything in its place</text>
    <rect x="203" y="347" width="325" height="53" rx="8" stroke="#ebede7"/>
    <rect x="214" y="361" width="25" height="25" rx="6" fill="#edf3e9"/>
    <path d="m222 373 4 4 6-8" stroke="#719269" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="249" y="369" font-family="Arial,sans-serif" font-size="10" fill="#464d40">Your workspace, connected</text>
    <text x="249" y="385" font-family="Arial,sans-serif" font-size="8" fill="#92998b">Store · Retail · Cloud</text>
    <path d="M504 373h9m-4-4 4 4-4 4" stroke="#82897b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Product card. -->
  <g transform="rotate(7 529 127)" filter="url(#shadow)">
    <rect x="465" y="54" width="135" height="151" rx="14" fill="white" stroke="#dedfd9"/>
    <rect x="475" y="64" width="115" height="93" rx="9" fill="#eaf0e5"/>
    <path d="M511 99h44l5 45h-54l5-45Z" fill="#d2dcc6" stroke="#849477" stroke-width="1.4" stroke-linejoin="round"/>
