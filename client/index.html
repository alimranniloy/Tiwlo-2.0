<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Mobile Browser Address Bar & Status Bar Theme Color (Light: #FFFFFF White, Dark: #0B0F17) -->
    <meta name="theme-color" content="#FFFFFF" id="theme-color-meta" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0F17" />
    <!-- Apple iOS Safari & Mobile Browser Web App Configuration -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="apple-status-bar-meta" />
    <meta name="msapplication-navbutton-color" content="#FFFFFF" id="ms-navbutton-meta" />
    <!-- Immediate Mobile Status Bar & Theme Sync (Prevents flash of dark/black status bar) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tiwlo_theme') || localStorage.getItem('theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var meta = document.getElementById('theme-color-meta');
          var appleMeta = document.getElementById('apple-status-bar-meta');
          var msMeta = document.getElementById('ms-navbutton-meta');
          if (isDark) {
            document.documentElement.classList.add('dark');
            if (meta) meta.setAttribute('content', '#0B0F17');
            if (appleMeta) appleMeta.setAttribute('content', 'black-translucent');
            if (msMeta) msMeta.setAttribute('content', '#0B0F17');
          } else {
            document.documentElement.classList.remove('dark');
            if (meta) meta.setAttribute('content', '#FFFFFF');
            if (appleMeta) appleMeta.setAttribute('content', 'default');
            if (msMeta) msMeta.setAttribute('content', '#FFFFFF');
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* Clean Google-inspired initial bootstrap loader (pure white background, Tiwlo brand blue indicator) */
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #ffffff; }
      #app-bootstrap-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        color: #1F2937;
        background: #ffffff;
        transition: opacity 180ms ease, visibility 180ms ease;
      }
      #app-bootstrap-loader.app-ready { opacity: 0; visibility: hidden; pointer-events: none; }
      .bootstrap-loader-mark {
        width: 28px;
        height: 28px;
        border: 2.8px solid #E8F0FE;
        border-top-color: #0B57D0;
        border-radius: 50%;
        animation: tiwlo-bootstrap-spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes tiwlo-bootstrap-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bootstrap-loader-mark { animation: none; }
      }
    </style>
    <title>Tiwlo - Inventory & POS Management</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F6F8FB] dark:bg-[#0B0F17] text-[#1E293B] dark:text-[#E2E8F0] antialiased selection:bg-blue-500 selection:text-white transition-colors duration-200">
    <div id="app-bootstrap-loader" role="status" aria-label="Loading">
      <div class="bootstrap-loader-mark" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
